server:
  port: ${PORT:8082}

spring:
  application:
    name: mercado-express

  # PostgreSQL (docker-compose expõe o container na porta 5433 do computador)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mercado_express}
    username: ${DB_USERNAME:mercado}
    password: ${DB_PASSWORD:mercado_dev_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:mercado}
    password: ${RABBITMQ_PASSWORD:mercado_dev_123}
    listener:
      simple:
        # Tenta processar a mensagem até 3 vezes; depois descarta em vez de reenfileirar para sempre
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: true

app:
  banco-tranquilo:
    url: ${BANCO_TRANQUILO_URL:http://localhost:8081}

  mail:
    from: ${MAIL_FROM:no-reply@mercadoexpress.local}

  # Cadastra produtos de exemplo se a tabela estiver vazia
  seed-produtos: ${SEED_PRODUTOS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
