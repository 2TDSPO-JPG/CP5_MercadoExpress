server:
  port: ${PORT:8082}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: mercado-express

  # PostgreSQL (docker-compose expõe o container na porta 5433 do computador)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mercado_express}
    username: ${DB_USERNAME:mercado}
    password: ${DB_PASSWORD:mercado_dev_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        # Tenta processar a mensagem até 3 vezes; depois descarta em vez de reenfileirar para sempre
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: true

app:
  banco-tranquilo:
    url: ${BANCO_TRANQUILO_URL:http://localhost:8081}
    # Chave exigida pela API do Banco Tranquilo (cabeçalho X-API-KEY) — mesma do banco-tranquilo-api
    api-key: ${BANCO_API_KEY:bt-dev-chave-local-123}

  mail:
    from: ${MAIL_FROM:no-reply@mercadoexpress.local}

  # Cadastra produtos de exemplo se a tabela estiver vazia
  seed-produtos: ${SEED_PRODUTOS:true}

  # Link do botão "RabbitMQ" nas páginas (no deploy, aponte para http://<ip-da-vm>:15672)
  rabbitmq-dashboard-url: ${RABBITMQ_DASHBOARD_URL:http://localhost:15672}

  # Usuários criados na primeira execução (somente se ainda não existirem).
  # Em produção, defina as variáveis de ambiente com senhas fortes.
  usuarios:
    admin-email: ${ADMIN_EMAIL:admin@mercadoexpress.com}
    admin-senha: ${ADMIN_PASSWORD:Admin@2026}
    cliente-email: ${CLIENTE_EMAIL:cliente@mercadoexpress.com}
    cliente-senha: ${CLIENTE_PASSWORD:Cliente@2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info
