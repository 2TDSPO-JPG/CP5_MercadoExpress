server:
  port: ${PORT:8082}
spring:
  application:
    name: mercado-express
  datasource:
    url: jdbc:postgresql://localhost:5433/mercado_express
    username: mercado
    password: mercado_dev_123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:mercado}
    password: ${RABBITMQ_PASSWORD:mercado_dev_123}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
app:
  banco-tranquilo:
    url: ${BANCO_TRANQUILO_URL:http://localhost:8081}
  mail:
    from: ${MAIL_FROM:no-reply@mercadoexpress.local}
management:
  endpoints:
    web:
      exposure:
        include: health,info
