name: Deploy na Azure (App Service)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  banco-tranquilo:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_WEBAPP_BANCO != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build (Maven)
        working-directory: banco-tranquilo-api
        run: mvn -B -DskipTests package
      - name: Deploy no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_BANCO }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_BANCO }}
          package: banco-tranquilo-api/target/*.jar

  mercado-express:
    runs-on: ubuntu-latest
    needs: banco-tranquilo
    if: ${{ vars.AZURE_WEBAPP_MERCADO != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build (Maven)
        working-directory: mercado-express
        run: mvn -B -DskipTests package
      - name: Deploy no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_MERCADO }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_MERCADO }}
          package: mercado-express/target/*.jar
